
name: Build Reel Monster APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Android project
        id: project
        run: |
          if [ -f settings.gradle ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f reel-monster/settings.gradle ]; then
            echo "dir=reel-monster" >> "$GITHUB_OUTPUT"
          else
            echo "Gradle project not found"
            exit 1
          fi

      - name: Build APK
        run: |
          gradle --no-daemon \
            -p "${{ steps.project.outputs.dir }}" \
            assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Reel-Monster-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
